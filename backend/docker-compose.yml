services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocab}
      POSTGRES_DB: ${POSTGRES_DB:-vocab}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocab}:${POSTGRES_PASSWORD:-vocab}@db:5432/${POSTGRES_DB:-vocab}
      MIGRATION_BACKUP_DIR: /var/backups/english-vocab/migrations
    ports:
      - "0.0.0.0:${API_PORT:-8001}:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ${MIGRATION_BACKUP_HOST_DIR:-${HOME}/.local/state/english-vocab-app/migration-backups}:/var/backups/english-vocab/migrations
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  prompt-worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocab}:${POSTGRES_PASSWORD:-vocab}@db:5432/${POSTGRES_DB:-vocab}
    volumes:
      - ./app:/app/app
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    # API runs migrations; worker retries until the queue table is available.
    entrypoint: ["python", "-m", "app.prompt_worker"]
    restart: unless-stopped

  embedding-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocab}:${POSTGRES_PASSWORD:-vocab}@db:5432/${POSTGRES_DB:-vocab}
    volumes:
      - ./app:/app/app
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.embedding_worker"]
    restart: unless-stopped

volumes:
  postgres_data:
