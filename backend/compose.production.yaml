name: wordrecall

services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Missing POSTGRES_USER}:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Missing POSTGRES_DB}
      APP_ENVIRONMENT: production
      MIGRATION_BACKUP_DIR: /var/backups/wordrecall
      AUTH_COOKIE_SECURE: "true"
      CORS_ORIGINS: '["https://vocab.jerryitdev.com"]'

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - migration_backups:/var/backups/wordrecall

    depends_on:
      db:
        condition: service_healthy

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  migration_backups:
  postgres_data:
