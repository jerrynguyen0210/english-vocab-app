name: Backend

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocab -d vocab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Generate ephemeral CI configuration
        run: python -c 'import os, secrets; open(os.environ["GITHUB_ENV"], "a").write("SECRET_KEY=" + secrets.token_urlsafe(48) + "\nDATABASE_URL=postgresql+psycopg://vocab:vocab@localhost:5432/vocab\n")'
      - name: Reject edits to existing migrations
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_migration_history.py
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python -m app.migrate
      - run: alembic check
      - run: python -m app.migrate
