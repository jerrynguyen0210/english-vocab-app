<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="661px" preserveAspectRatio="none" style="width:1993px;height:661px;background:#FFFFFF;" version="1.1" viewBox="0 0 1993 661" width="1993px" zoomAndPan="magnify"><title>WordRecall - Backend System Context</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="302.21" x="838.7832" y="22.9951">WordRecall - Backend System Context</text></g><!--entity learner--><g class="entity" data-entity="learner" data-source-line="34" data-uid="ent0002" id="entity_learner"><ellipse cx="32.9951" cy="202.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M32.9951,210.2969 L32.9951,237.2969 M19.9951,218.2969 L45.9951,218.2969 M32.9951,237.2969 L19.9951,252.2969 M32.9951,237.2969 L45.9951,252.2969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.9902" x="6" y="266.792">Learner</text></g><!--entity client--><g class="entity" data-entity="client" data-source-line="35" data-uid="ent0003" id="entity_client"><rect fill="#EEF4FB" height="101.4844" rx="6" ry="6" style="stroke:#355777;stroke-width:0.5;" width="209.4443" x="357" y="181.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3496" x="367" y="204.292">WordRecall client</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.4443" x="367" y="220.5889">[External software system]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="367" y="236.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.0859" x="367" y="253.1826">Expo / React Native</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.7129" x="367" y="269.4795">Web, iOS and Android</text></g><!--entity backend--><g class="entity" data-entity="backend" data-source-line="37" data-uid="ent0004" id="entity_backend"><rect fill="#DCEEDC" height="166.6719" rx="6" ry="6" style="stroke:#355777;stroke-width:0.5;" width="272.6016" x="1024.5" y="233.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.541" x="1034.5" y="256.292">WordRecall backend</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.8496" x="1034.5" y="272.5889">[System in scope]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1034.5" y="288.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.0791" x="1034.5" y="305.1826">Accounts and authentication</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="246.4424" x="1034.5" y="321.4795">Dictionary lookup and saved words</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="252.6016" x="1034.5" y="337.7764">Scheduled reviews and topic search</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.8232" x="1034.5" y="354.0732">Common-word practice</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1034.5" y="370.3701">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.8965" x="1034.5" y="386.667">FastAPI API + background workers</text></g><!--entity postgres--><g class="entity" data-entity="postgres" data-source-line="39" data-uid="ent0005" id="entity_postgres"><path d="M1723.5,53.2969 C1723.5,43.2969 1850.1382,43.2969 1850.1382,43.2969 C1850.1382,43.2969 1976.7764,43.2969 1976.7764,53.2969 L1976.7764,192.6719 C1976.7764,202.6719 1850.1382,202.6719 1850.1382,202.6719 C1850.1382,202.6719 1723.5,202.6719 1723.5,192.6719 L1723.5,53.2969" fill="#F4F1FA" style="stroke:#685181;stroke-width:0.5;"/><path d="M1723.5,53.2969 C1723.5,63.2969 1850.1382,63.2969 1850.1382,63.2969 C1850.1382,63.2969 1976.7764,63.2969 1976.7764,53.2969" fill="none" style="stroke:#685181;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7529" x="1733.5" y="80.292">PostgreSQL</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.4072" x="1733.5" y="96.5889">[External data store]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1733.5" y="112.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.9307" x="1733.5" y="129.1826">Accounts and token hashes</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.9082" x="1733.5" y="145.4795">Words and embedding vectors</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.7813" x="1733.5" y="161.7764">Review schedules and attempts</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="233.2764" x="1733.5" y="178.0732">Question bank, learning progress</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.6621" x="1733.5" y="194.3701">and persistent generation jobs</text></g><!--entity openrouter--><g class="entity" data-entity="openrouter" data-source-line="41" data-uid="ent0006" id="entity_openrouter"><rect fill="#EEF4FB" height="117.7813" rx="6" ry="6" style="stroke:#355777;stroke-width:0.5;" width="268.2881" x="1716" y="257.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.417" x="1726" y="280.792">OpenRouter</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.4443" x="1726" y="297.0889">[External software system]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1726" y="313.3857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.0684" x="1726" y="329.6826">Language-model gateway</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.6846" x="1726" y="345.9795">Review sentence generation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.2881" x="1726" y="362.2764">Common-word question generation</text></g><!--entity ollama--><g class="entity" data-entity="ollama" data-source-line="43" data-uid="ent0007" id="entity_ollama"><rect fill="#EEF4FB" height="101.4844" rx="6" ry="6" style="stroke:#355777;stroke-width:0.5;" width="228.8789" x="1735.5" y="431.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.5947" x="1745.5" y="454.292">Ollama</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.4443" x="1745.5" y="470.5889">[External software system]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1745.5" y="486.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.2168" x="1745.5" y="503.1826">Embedding model server</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.8789" x="1745.5" y="519.4795">Saved-word and topic vectors</text></g><!--entity operator--><g class="entity" data-entity="operator" data-source-line="45" data-uid="ent0008" id="entity_operator"><ellipse cx="461.5068" cy="346.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M461.5068,354.2969 L461.5068,381.2969 M448.5068,362.2969 L474.5068,362.2969 M461.5068,381.2969 L448.5068,396.2969 M461.5068,381.2969 L474.5068,396.2969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.0137" x="339" y="410.792">Operator / deployment automation</text></g><g class="entity" data-entity="GMN15" data-source-line="55" data-uid="ent0016" id="entity_GMN15"><path d="M960,461.2969 L960,504.6953 A6,6 0 0 0 966,510.6953 L1355.7197,510.6953 A6,6 0 0 0 1361.7197,504.6953 L1361.7197,465.2969 L1351.7197,455.2969 L1165,455.2969 L1161,400.3469 L1157,455.2969 L966,455.2969 A6,6 0 0 0 960,461.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1351.7197,455.2969 L1351.7197,462.2969 A3,3 0 0 0 1354.7197,465.2969 L1361.7197,465.2969 L1351.7197,455.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.9121" x="966" y="472.3638">Local dictionary: WordNet corpus + LemmInflect.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.6577" x="966" y="487.4966">Authentication is implemented by the backend.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.7197" x="966" y="502.6294">Workers belong to this system; jobs persist in PostgreSQL.</text></g><!--link learner to client--><g class="link" data-entity-1="learner" data-entity-2="client" data-source-line="47" data-uid="lnk9" id="link_learner_client"><path d="M60.04,231.7969 C117.64,231.7969 252.55,231.7969 350.82,231.7969" fill="none" id="learner-to-client" style="stroke:#355777;stroke-width:1;"/><polygon fill="#355777" points="356.82,231.7969,347.82,227.7969,351.82,231.7969,347.82,235.7969,356.82,231.7969" style="stroke:#355777;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.5688" x="122.949" y="212.8638">Registers, saves words,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.4668" x="96" y="227.9966">practises and manages account</text></g><!--link client to backend--><g class="link" data-entity-1="client" data-entity-2="backend" data-source-line="48" data-uid="lnk10" id="link_client_backend"><path d="M566.17,244.4269 C687.89,259.2669 884.204,283.1913 1018.324,299.5313" fill="none" id="client-to-backend" style="stroke:#355777;stroke-width:1;"/><polygon fill="#355777" points="1024.28,300.2569,1015.8298,295.1978,1019.3167,299.6522,1014.8623,303.1391,1024.28,300.2569" style="stroke:#355777;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.2559" x="684.8889" y="202.8638">JSON over HTTP(S): /api/v1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.0337" x="620" y="217.9966">Auth, account, words, reviews, common words</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.999" x="627.0173" y="233.1294">Bearer access token; browser refresh cookie</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.3921" x="697.3208" y="248.2622">or native refresh token</text></g><!--link backend to postgres--><g class="link" data-entity-1="backend" data-entity-2="postgres" data-source-line="49" data-uid="lnk11" id="link_backend_postgres"><path d="M1297.71,272.1769 C1330.14,261.8769 1364.72,251.1869 1397,241.7969 C1506.66,209.8869 1626.5538,178.5607 1717.5138,155.5107" fill="none" id="backend-to-postgres" style="stroke:#355777;stroke-width:1;"/><polygon fill="#355777" points="1723.33,154.0369,1713.6232,152.3702,1718.4832,155.2651,1715.5883,160.1251,1723.33,154.0369" style="stroke:#355777;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.457" x="1428.439" y="132.8638">Reads and writes application data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.335" x="1406" y="147.9966">Claims jobs and stores generated results</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.2046" x="1438.0652" y="163.1294">SQL via SQLAlchemy / psycopg</text></g><!--link backend to openrouter--><g class="link" data-entity-1="backend" data-entity-2="openrouter" data-source-line="50" data-uid="lnk12" id="link_backend_openrouter"><path d="M1297.73,316.7969 C1418.95,316.7969 1589.47,316.7969 1709.89,316.7969" fill="none" id="backend-to-openrouter" style="stroke:#355777;stroke-width:1;"/><polygon fill="#355777" points="1715.89,316.7969,1706.89,312.7969,1710.89,316.7969,1706.89,320.7969,1715.89,316.7969" style="stroke:#355777;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.2549" x="1398" y="267.8638">Sends word + meaning or word exclusions;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.8193" x="1403.2178" y="282.9966">receives generated sentences / questions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3442" x="1418.4553" y="298.1294">HTTPS JSON: POST /chat/completions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.4707" x="1449.8921" y="313.2622">Background prompt worker</text></g><!--link backend to ollama--><g class="link" data-entity-1="backend" data-entity-2="ollama" data-source-line="51" data-uid="lnk13" id="link_backend_ollama"><path d="M1297.63,362.9369 C1329.99,373.1569 1364.55,383.4169 1397,391.7969 C1511.08,421.2569 1637.5512,445.5646 1729.4512,461.7746" fill="none" id="backend-to-ollama" style="stroke:#355777;stroke-width:1;"/><polygon fill="#355777" points="1735.36,462.8169,1727.1916,457.3143,1730.436,461.9483,1725.802,465.1927,1735.36,462.8169" style="stroke:#355777;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.9668" x="1419.5024" y="342.8638">Sends saved-word text / topic query;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.355" x="1447.3083" y="357.9966">receives embedding vectors</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.73" x="1435.1208" y="373.1294">HTTP(S) JSON: POST /api/embed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.9717" x="1416.5" y="388.2622">API topic search + embedding worker</text></g><!--link operator to backend--><g class="link" data-entity-1="operator" data-entity-2="backend" data-source-line="52" data-uid="lnk14" id="link_operator_backend"><path d="M584.06,375.4969 C677.52,374.1969 809.73,370.0369 925,357.7969 C957.33,354.3669 986.0154,350.1854 1018.4454,344.6554" fill="none" id="operator-to-backend" style="stroke:#355777;stroke-width:1;"/><polygon fill="#355777" points="1024.36,343.6469,1014.8157,341.2166,1019.4311,344.4873,1016.1604,349.1028,1024.36,343.6469" style="stroke:#355777;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.5791" x="677.2129" y="338.8638">Runs migration / export CLIs;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.0049" x="665" y="353.9966">checks GET /health over HTTP(S)</text></g><g class="legend" data-source-line="60"><rect fill="#DDDDDD" height="91.4844" rx="6" ry="6" style="stroke:#000000;stroke-width:1;" width="681.2891" x="649.2437" y="549.7813"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="630.0615" x="654.2437" y="567.7764">Scope: the implemented backend and its direct environment, not a deployment topology.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487.9561" x="654.2437" y="584.0732">Arrows identify the caller; labels describe request and response data.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="541.6318" x="654.2437" y="600.3701">PostgreSQL and model servers sit outside the backend application boundary.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="671.2891" x="654.2437" y="616.667">Ollama review generation also exists as a standalone CLI; the prompt worker uses OpenRouter.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="561.5791" x="654.2437" y="632.9639">/health reports API liveness without checking database or provider connectivity.</text></g><!--SRC=[ZLTDRnit4BtlhnWuXtx9LjtMTM031HHRJbCejcCboA4g0cgNabXnoGr9IHQC_FU-8NUbNJjfSZ0iaSEPUSCtZwEWWfRqthhYJkP2Qpga5o9VIbFGUEk3BEd2cY3lGvPzHsExShcaIeI59-4aEQb5K6j9mL9OyFVAUXMisvApDXpXpE3s5KtjoXJ2RSzecdptHLNrIw7CKRNjTHP5fVhEhe9ql8NpzFbjttyGgx3eYJo7yz3R087lERbMSkDxkIrBQpwanOKKEYm-mH_StKhd5N2PN7QpoQsJ_K84CHLUFachj8NKllzZSl9I6ka0t9gkZyhPiWeSTlc5_BrqQvKZ-zhqNplr_M-nRo7wF_zQb_q7MqcJQlWX5QJNMacEwceCowai2cNclWj4DklVX6LdxP_KRMTJtqm_s4hbFaM_L3dNy0anTeUAdK4wS5FLPN-KxaEfvjYGFNbVMHS-hE2XHdYXbJI1Al1qPbq9seBPpJLJ8IjjjoKipkXkEBXyFJmgYps2mkA_EqJ9G6jvj2qrFBxpqfCFWXbTqAqM9hnxFI9hzFQSZ4KFb3P8KYRNgmAcrb7kP84OIkYcRJwk5DQEiapBMU3kSMg-25HWDKBE_5APIZXHab-8mcvGNPhXl6pj578cLZfSeK6lHIbfB8mVIwTcBHl7hGTkWx1q_4jhmu3HNbPqSjAs5cR9Yw